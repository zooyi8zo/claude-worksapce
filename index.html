<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데스노트 — 블랙리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{
  --cover:#0b0b0c;
  --cover-edge:#232326;
  --paper:#e7dfc8;
  --paper-dark:#d8cfb4;
  --line:rgba(58,46,28,.16);
  --ink:#1b1713;
  --blood:#9b1b1b;
  --blood-hot:#c92a2a;
  --text:#e9e5dc;
  --muted:#8d887c;
  --gothic:'Pirata One', 'Times New Roman', serif;
  --hand:'Nanum Pen Script', 'Segoe Script', cursive;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  font-size:17px;
  line-height:1.6;
  color:var(--text);
  background:#050505;
  background-image:
    radial-gradient(ellipse at 50% 0%, #1a1a1d 0%, #050505 60%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  overflow-x:hidden;
}

.stage{width:100%;max-width:880px}

.screen{display:none}
.screen.is-active{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 표지 ---------- */
.cover-wrap{display:flex;flex-direction:column;align-items:center;gap:28px}

.cover{
  width:260px;
  height:368px;
  background:
    repeating-linear-gradient(92deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px),
    linear-gradient(145deg,#1a1a1d 0%, var(--cover) 45%, #000 100%);
  border-radius:4px 10px 10px 4px;
  border:1px solid #2b2b2f;
  border-left:7px solid #141417;
  box-shadow:
    0 2px 0 #000,
    0 30px 60px -20px rgba(0,0,0,.95),
    inset 0 1px 0 rgba(255,255,255,.06);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:transform .35s cubic-bezier(.2,.8,.3,1), box-shadow .35s;
  position:relative;
}
.cover:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:0 2px 0 #000,0 44px 70px -22px rgba(0,0,0,1)}
.cover:active{transform:translateY(-2px) scale(.99)}

.cover::after{
  content:'';position:absolute;inset:14px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:3px;pointer-events:none;
}

.cover h1{
  font-family:var(--gothic);
  font-size:42px;
  font-weight:400;
  line-height:1.05;
  letter-spacing:1px;
  color:#f2efe8;
  text-align:center;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}
.cover .kr{
  font-family:var(--hand);
  font-size:24px;
  color:#9a958a;
  letter-spacing:2px;
}

.hint{color:var(--muted);font-size:17px;letter-spacing:.5px}
.hint::before{content:'▸ ';color:var(--blood-hot)}

/* ---------- 펼친 노트 ---------- */
.note{
  display:flex;
  background:var(--paper);
  border-radius:3px;
  box-shadow:
    0 30px 70px -24px rgba(0,0,0,.95),
    0 0 0 10px #111 inset,
    0 0 0 1px #2a2a2a;
  padding:10px;
  position:relative;
  animation:open .5s cubic-bezier(.2,.8,.3,1);
}
@keyframes open{from{transform:perspective(1400px) rotateY(-28deg);opacity:0}to{transform:none;opacity:1}}

.note::before{ /* 가운데 접힘 */
  content:'';position:absolute;left:50%;top:10px;bottom:10px;width:34px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(90,75,50,.22),rgba(90,75,50,.3),rgba(90,75,50,.22),transparent);
  pointer-events:none;z-index:2;
}

.page{
  flex:1;
  min-width:0;
  padding:28px 26px;
  background-image:repeating-linear-gradient(transparent 0 33px, var(--line) 33px 34px);
  background-position:0 10px;
}
.page+.page{border-left:1px solid rgba(90,75,50,.15)}

.page h2{
  font-family:var(--gothic);
  font-size:26px;
  font-weight:400;
  color:var(--ink);
  letter-spacing:.5px;
  margin-bottom:14px;
  line-height:34px;
}

.rules{list-style:none;font-family:var(--hand);font-size:22px;color:#4a3f30;line-height:34px}
.rules li{padding-left:18px;position:relative}
.rules li::before{content:'·';position:absolute;left:4px;color:var(--blood)}

/* 기입란 */
.field{margin-bottom:6px}
.field label{
  display:block;
  font-family:var(--hand);
  font-size:20px;
  color:#6b5c46;
  line-height:34px;
}
.write{
  width:100%;
  font-family:var(--hand);
  font-size:30px;
  line-height:34px;
  color:var(--ink);
  background:transparent;
  border:none;
  border-bottom:2px solid rgba(60,48,30,.35);
  padding:0 4px 2px;
  outline:none;
}
.write::placeholder{color:rgba(60,48,30,.3)}
.write:focus{border-bottom-color:var(--blood)}
.write[readonly]{color:var(--blood);border-bottom-style:dashed}

.arrow{
  font-family:var(--gothic);
  font-size:34px;
  line-height:34px;
  color:var(--blood);
  letter-spacing:6px;
  margin:10px 0;
  animation:bleed 1.6s ease-in-out infinite;
}
@keyframes bleed{0%,100%{opacity:.45}50%{opacity:1}}

.seal{
  width:100%;
  font-family:var(--gothic);
  font-size:21px;
  letter-spacing:1px;
  color:#f0ece4;
  background:linear-gradient(180deg,var(--blood-hot),var(--blood));
  border:none;
  border-radius:2px;
  padding:13px 18px;
  margin-top:14px;
  cursor:pointer;
  box-shadow:0 3px 0 #5e1010;
  transition:transform .12s, box-shadow .12s, filter .2s;
}
.seal:hover{filter:brightness(1.12)}
.seal:active{transform:translateY(3px);box-shadow:0 0 0 #5e1010}

.ghost{
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:16px;
  margin-top:18px;text-decoration:underline;text-underline-offset:4px;
}
.ghost:hover{color:var(--text)}

/* ---------- 게임 ---------- */
.target-line{
  font-family:var(--hand);
  font-size:34px;
  line-height:34px;
  color:var(--blood);
  text-decoration:line-through;
  text-decoration-color:rgba(155,27,27,.5);
  word-break:break-all;
  margin-bottom:34px;
}

.hp{margin-bottom:12px}
.hp-track{
  height:14px;
  background:rgba(40,32,20,.25);
  border:1px solid rgba(60,48,30,.35);
  border-radius:2px;
  overflow:hidden;
}
.hp-fill{
  height:100%;
  background:linear-gradient(90deg,var(--blood),var(--blood-hot));
  transition:width .25s ease;
}
.hp-text{
  font-family:var(--hand);
  font-size:21px;
  color:#5a4c38;
  line-height:34px;
  display:flex;justify-content:space-between;
}

.doll-stage{
  display:flex;justify-content:center;
  padding:6px 0 10px;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.doll{width:170px;height:auto;overflow:visible;transition:transform .08s}
.doll-stage:active .doll{transform:scale(.97)}
.doll.hit{animation:whack .34s cubic-bezier(.3,1.4,.5,1)}
@keyframes whack{
  0%{transform:translateY(0) rotate(0)}
  28%{transform:translateY(12px) scaleY(.86) rotate(-4deg)}
  60%{transform:translateY(-6px) scaleY(1.04) rotate(3deg)}
  100%{transform:none}
}
.doll.down{transform:rotate(90deg) translateX(14px);opacity:.55;transition:transform .5s, opacity .5s}

.mallet{
  position:absolute;
  font-size:54px;
  pointer-events:none;
  opacity:0;
  transform-origin:80% 80%;
}
.mallet.swing{animation:swing .34s ease-out}
@keyframes swing{
  0%{opacity:1;transform:translate(26px,-74px) rotate(-62deg)}
  45%{opacity:1;transform:translate(6px,-18px) rotate(8deg)}
  100%{opacity:0;transform:translate(6px,-14px) rotate(2deg)}
}

.pop{
  position:absolute;
  font-family:var(--gothic);
  font-size:26px;
  color:var(--blood-hot);
  pointer-events:none;
  animation:pop .7s ease-out forwards;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
@keyframes pop{
  0%{opacity:1;transform:translate(0,0) scale(.8)}
  100%{opacity:0;transform:translate(var(--dx,18px),-56px) scale(1.25)}
}

.tap-cue{font-family:var(--hand);font-size:21px;color:#6b5c46;text-align:center;line-height:34px}

/* 명단 */
.list{list-style:none;margin-bottom:4px}
.list li{
  display:flex;justify-content:space-between;gap:10px;
  font-family:var(--hand);font-size:23px;line-height:34px;
  color:#4a3f30;
}
.list li.me{color:var(--blood)}
.list .dmg{white-space:nowrap}
.empty{font-family:var(--hand);font-size:21px;color:#8b7d66;line-height:34px}

.log li{display:block;line-height:34px;color:#5a4c38;font-family:var(--hand);font-size:21px}
.log .who{color:var(--blood)}

/* ---------- 모달 ---------- */
.modal{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.88);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal.is-open{display:flex;animation:fade .3s ease}
.modal-card{
  background:var(--paper);
  color:var(--ink);
  width:100%;max-width:460px;
  padding:34px 30px;
  border-radius:3px;
  box-shadow:0 0 0 10px #111, 0 40px 80px -20px #000;
  text-align:center;
  background-image:repeating-linear-gradient(transparent 0 33px, var(--line) 33px 34px);
  background-position:0 18px;
}
.modal-card h2{
  font-family:var(--hand);
  font-size:36px;font-weight:400;line-height:34px;
  color:var(--blood);
}
.modal-card .bless{
  font-family:var(--hand);
  font-size:26px;line-height:34px;
  color:#5a4c38;
  margin-bottom:34px;
}
.modal-card .when{font-family:var(--hand);font-size:20px;color:#6b5c46;line-height:34px;margin-bottom:34px}
.modal-card .list{text-align:left;margin-bottom:34px}

@media (max-width:720px){
  .note{flex-direction:column;padding:8px}
  .note::before{display:none}
  .page{padding:20px 18px}
  .page+.page{border-left:none;border-top:1px solid rgba(90,75,50,.2)}
  .cover{width:218px;height:310px}
  .cover h1{font-size:34px}
  .target-line{font-size:28px}
  .doll{width:140px}
}
</style>
</head>
<body>

<div class="stage">

  <!-- 1. 표지 -->
  <section class="screen is-active" id="s-cover">
    <div class="cover-wrap">
      <div class="cover" id="coverBook">
        <h1>DEATH<br>NOTE</h1>
        <span class="kr">블랙리스트</span>
      </div>
      <p class="hint">노트를 펼친다</p>
    </div>
  </section>

  <!-- 2. 기입 -->
  <section class="screen" id="s-write">
    <div class="note">
      <div class="page">
        <h2>How to use it</h2>
        <ul class="rules">
          <li>이 노트에 이름이 적힌 자는 사라진다.</li>
          <li>얼굴을 떠올리며 적어야 한다.</li>
          <li>적힌 자는 망치 100대를 맞는다.</li>
          <li>여럿이 함께 때릴 수 있다.</li>
          <li>가장 많이 때린 자의 이름이 남는다.</li>
        </ul>
      </div>
      <div class="page">
        <div class="field">
          <label>이름</label>
          <input class="write" id="targetInput" maxlength="24" placeholder="진상의 이름" autocomplete="off">
        </div>
        <div class="arrow">&gt;&gt;&gt;</div>
        <div class="field">
          <label>집행자 (당신)</label>
          <input class="write" id="meInput" maxlength="16" placeholder="내 이름" autocomplete="off">
        </div>
        <button class="seal" id="sealBtn">세상에서 지운다</button>
        <button class="ghost" id="closeBtn">노트를 덮는다</button>
      </div>
    </div>
  </section>

  <!-- 3. 집행 -->
  <section class="screen" id="s-game">
    <div class="note">
      <div class="page">
        <div class="target-line" id="targetName"></div>
        <div class="hp">
          <div class="hp-track"><div class="hp-fill" id="hpFill"></div></div>
          <div class="hp-text"><span>남은 체력</span><span id="hpNum"></span></div>
        </div>
        <div class="doll-stage" id="dollStage">
          <svg class="doll" id="doll" viewBox="0 0 140 180" aria-label="인형">
            <g stroke="#8a7554" stroke-width="3" stroke-linecap="round" fill="none">
              <path d="M44 92 L18 118"/><path d="M96 92 L122 118"/>
              <path d="M56 136 L50 170"/><path d="M84 136 L90 170"/>
            </g>
            <circle cx="18" cy="118" r="7" fill="#cbb48c" stroke="#8a7554" stroke-width="2.5"/>
            <circle cx="122" cy="118" r="7" fill="#cbb48c" stroke="#8a7554" stroke-width="2.5"/>
            <ellipse cx="50" cy="172" rx="9" ry="6" fill="#cbb48c" stroke="#8a7554" stroke-width="2.5"/>
            <ellipse cx="90" cy="172" rx="9" ry="6" fill="#cbb48c" stroke="#8a7554" stroke-width="2.5"/>
            <rect x="42" y="82" width="56" height="58" rx="20" fill="#cbb48c" stroke="#8a7554" stroke-width="2.5"/>
            <path d="M56 100 h28 M56 112 h28" stroke="#b09772" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
            <path d="M62 78 l4 6 M70 77 l0 7 M78 78 l-4 6" stroke="#8a7554" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="70" cy="48" r="32" fill="#d6c097" stroke="#8a7554" stroke-width="2.5"/>
            <path d="M70 16 q-10 8 -4 16" stroke="#8a7554" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <circle cx="56" cy="58" r="4" fill="#e59aa0" opacity=".5"/>
            <circle cx="84" cy="58" r="4" fill="#e59aa0" opacity=".5"/>
            <g id="face"></g>
            <g id="wounds"></g>
          </svg>
          <span class="mallet" id="mallet">🔨</span>
        </div>
        <p class="tap-cue">인형을 두드린다</p>
      </div>
      <div class="page">
        <h2>집행자</h2>
        <ul class="list" id="players"></ul>
        <h2 style="margin-top:34px">지워진 이름</h2>
        <ul class="list log" id="history"></ul>
        <button class="ghost" id="wipeBtn">기록을 태운다</button>
      </div>
    </div>
  </section>

</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="modalTitle"></h2>
    <p class="bless" id="modalBless"></p>
    <p class="when" id="modalWhen"></p>
    <ul class="list" id="modalList"></ul>
    <button class="seal" id="againBtn">새 이름을 적는다</button>
  </div>
</div>

<script>
const KEY = 'deathnote.v2';
const MAX_HP = 100;
const FACES = {
  calm:  '<circle cx="59" cy="46" r="3.4" fill="#2b2b2b"/><circle cx="81" cy="46" r="3.4" fill="#2b2b2b"/><path d="M63 60 q7 5 14 0" stroke="#2b2b2b" stroke-width="2.5" fill="none" stroke-linecap="round"/>',
  panic: '<circle cx="59" cy="45" r="5" fill="#2b2b2b"/><circle cx="81" cy="45" r="5" fill="#2b2b2b"/><ellipse cx="70" cy="62" rx="6" ry="7" fill="#2b2b2b"/>',
  wreck: '<path d="M54 41 l9 9 M63 41 l-9 9 M77 41 l9 9 M86 41 l-9 9" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/><path d="M62 63 q8 -6 16 0" stroke="#2b2b2b" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
};

let myName = null;
let db = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { target:null, hp:MAX_HP, players:{}, wounds:[], history:[] };
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){}
}

const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll('.screen')
  .forEach(s => s.classList.toggle('is-active', s.id === id));

/* ---- 표지 → 기입 ---- */
$('coverBook').onclick = () => {
  show('s-write');
  const t = $('targetInput');
  if(db.target){
    t.value = db.target;
    t.readOnly = true;
    $('meInput').focus();
  }else{
    t.readOnly = false;
    t.focus();
  }
};
$('closeBtn').onclick = () => show('s-cover');

/* ---- 집행 시작 ---- */
$('sealBtn').onclick = () => {
  const target = $('targetInput').value.trim();
  const me = $('meInput').value.trim();
  if(!target){ $('targetInput').focus(); return; }
  if(!me){ $('meInput').focus(); return; }

  if(!db.target){ db.target = target; db.hp = MAX_HP; }
  if(!db.players[me]) db.players[me] = { damage:0, hits:0 };
  myName = me;
  save();
  show('s-game');
  render();
};

[$('targetInput'), $('meInput')].forEach(el => {
  el.onkeydown = e => { if(e.key === 'Enter') $('sealBtn').click(); };
});

/* ---- 타격 ---- */
$('dollStage').onclick = e => {
  if(!myName || db.hp <= 0) return;

  const dmg = 4 + Math.floor(Math.random() * 5);
  db.hp = Math.max(0, db.hp - dmg);
  db.players[myName].damage += dmg;
  db.players[myName].hits += 1;
  if(db.wounds.length < 14){
    db.wounds.push({ x: 46 + Math.random()*48, y: 30 + Math.random()*100 });
  }
  save();

  const doll = $('doll');
  doll.classList.remove('hit');
  void doll.offsetWidth;
  doll.classList.add('hit');

  const m = $('mallet');
  m.classList.remove('swing');
  void m.offsetWidth;
  m.classList.add('swing');

  floatDamage(e, dmg);
  render();

  if(db.hp <= 0) finish();
};

function floatDamage(e, dmg){
  const stage = $('dollStage');
  const box = stage.getBoundingClientRect();
  const el = document.createElement('span');
  el.className = 'pop';
  el.textContent = '-' + dmg;
  el.style.left = ((e.clientX ?? box.left + box.width/2) - box.left) + 'px';
  el.style.top  = ((e.clientY ?? box.top + box.height/2) - box.top) + 'px';
  el.style.setProperty('--dx', (Math.random()*44 - 22) + 'px');
  stage.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

/* ---- 처치 ---- */
function finish(){
  const record = {
    target: db.target,
    at: new Date().toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}),
    players: ranked()
  };
  db.history.push(record);
  save();

  $('doll').classList.add('down');
  setTimeout(() => openModal(record), 620);
}

function openModal(record){
  $('modalTitle').textContent = '이 사람을 응징했습니다.';
  $('modalBless').textContent = '행복한 하루 되시길';
  $('modalWhen').textContent = record.target + ' — ' + record.at;
  $('modalList').innerHTML = record.players.map((p, i) =>
    `<li class="${p.name === myName ? 'me' : ''}">
       <span>${i === 0 ? '1위 ' : (i+1) + '위 '}${esc(p.name)}</span>
       <span class="dmg">${p.damage}대 · ${p.hits}번</span>
     </li>`).join('');
  $('modal').classList.add('is-open');
}

$('againBtn').onclick = () => {
  $('modal').classList.remove('is-open');
  db.target = null;
  db.hp = MAX_HP;
  db.players = {};
  db.wounds = [];
  myName = null;
  save();
  $('doll').classList.remove('down');
  $('targetInput').value = '';
  $('targetInput').readOnly = false;
  $('meInput').value = '';
  show('s-cover');
};

$('wipeBtn').onclick = () => {
  if(!confirm('모든 기록을 태웁니다. 되돌릴 수 없습니다.')) return;
  db.history = [];
  save();
  render();
};

/* ---- 렌더 ---- */
function ranked(){
  return Object.entries(db.players)
    .map(([name, s]) => ({ name, ...s }))
    .sort((a, b) => b.damage - a.damage);
}

function render(){
  $('targetName').textContent = db.target || '';
  const pct = (db.hp / MAX_HP) * 100;
  $('hpFill').style.width = pct + '%';
  $('hpNum').textContent = db.hp + ' / ' + MAX_HP;

  $('face').innerHTML = pct > 66 ? FACES.calm : pct > 33 ? FACES.panic : FACES.wreck;
  $('wounds').innerHTML = db.wounds.map(w =>
    `<path d="M${w.x-5} ${w.y-5} l10 10 M${w.x+5} ${w.y-5} l-10 10"
       stroke="#9b1b1b" stroke-width="2.5" stroke-linecap="round" opacity=".75"/>`).join('');

  const list = ranked();
  $('players').innerHTML = list.length
    ? list.map((p, i) => `<li class="${p.name === myName ? 'me' : ''}">
        <span>${i === 0 ? '👑 ' : ''}${esc(p.name)}</span>
        <span class="dmg">${p.damage}대</span></li>`).join('')
    : '<li class="empty">아직 아무도 없다.</li>';

  $('history').innerHTML = db.history.length
    ? db.history.slice().reverse().slice(0, 8).map(h =>
        `<li>${esc(h.target)} — <span class="who">${esc(h.players[0]?.name ?? '?')}</span> 외 ${Math.max(0, h.players.length-1)}명</li>`).join('')
    : '<li class="empty">아직 비어 있다.</li>';
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- 다른 탭과 동기화 ---- */
window.addEventListener('storage', e => {
  if(e.key !== KEY || !e.newValue) return;
  db = JSON.parse(e.newValue);
  if(myName && !db.players[myName]) myName = null;
  render();
  if(db.hp <= 0 && !$('modal').classList.contains('is-open') &&
     $('s-game').classList.contains('is-active')){
    $('doll').classList.add('down');
    const last = db.history[db.history.length - 1];
    if(last) setTimeout(() => openModal(last), 620);
  }
});

render();
</script>
</body>
</html>
