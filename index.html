<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>반응속도 테스트</title>
<style>
  /* 화면 전체를 가운데 정렬하기 위한 기본 스타일 */
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "맑은 고딕", sans-serif;
    background-color: #f2f2f2;
  }

  h1 {
    margin-bottom: 8px;
    color: #333;
  }

  /* 최고 기록을 보여주는 텍스트 */
  #bestRecord {
    margin-bottom: 20px;
    font-size: 18px;
    color: #555;
  }

  /* 가운데에 있는 큰 네모 박스 */
  #box {
    width: 320px;
    height: 320px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    user-select: none; /* 텍스트가 드래그로 선택되는 것 방지 */
    transition: background-color 0.1s ease;
    padding: 20px;
    box-sizing: border-box;
  }

  /* 상태별 박스 색깔 */
  #box.wait {
    background-color: #e74c3c; /* 빨간색: 기다리는 중 */
  }
  #box.go {
    background-color: #2ecc71; /* 초록색: 지금 클릭! */
  }
  #box.too-soon {
    background-color: #e67e22; /* 주황색: 너무 빨리 눌렀을 때 */
  }
  #box.result {
    background-color: #3498db; /* 파란색: 결과 표시 */
  }

  /* 다시 시도 버튼 */
  #retryButton {
    margin-top: 20px;
    padding: 10px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background-color: #333;
    color: white;
    cursor: pointer;
  }
  #retryButton:hover {
    background-color: #555;
  }
</style>
</head>
<body>

  <h1>반응속도 테스트</h1>
  <!-- 최고 기록 표시 영역 -->
  <div id="bestRecord">최고 기록: 없음</div>

  <!-- 클릭 대상이 되는 큰 박스 -->
  <div id="box" class="wait">기다리세요</div>

  <!-- 언제든 처음부터 다시 시작할 수 있는 버튼 -->
  <button id="retryButton">다시 시도</button>

  <script>
    // ===== 상태(state)와 관련 변수들 =====
    // state는 현재 게임이 어떤 단계인지를 나타내는 값입니다.
    // 'wait'     : 박스가 빨간색이고 초록색으로 바뀌길 기다리는 중
    // 'go'       : 박스가 초록색으로 바뀌어서 클릭을 기다리는 중
    // 'tooSoon'  : 초록색으로 바뀌기 전에 클릭해서 실패한 상태
    // 'result'   : 반응 시간을 측정해서 결과를 보여주는 상태
    let state = 'wait';

    let waitTimerId = null;   // 초록색으로 바꾸는 setTimeout의 id (취소할 때 사용)
    let goStartTime = 0;      // 박스가 초록색으로 바뀐 순간의 시각(performance.now())
    let bestRecordMs = null;  // 지금까지 가장 빠른 기록 (아직 없으면 null)

    // 화면에 있는 요소들을 미리 찾아둡니다.
    const boxElement = document.getElementById('box');
    const bestRecordElement = document.getElementById('bestRecord');
    const retryButton = document.getElementById('retryButton');

    // 박스의 클래스와 문구를 현재 state에 맞게 바꿔주는 함수
    function setBoxClass(className, text) {
      boxElement.className = className; // 색깔을 바꾸기 위해 클래스 이름을 교체
      boxElement.textContent = text;     // 박스 안의 문구를 교체
    }

    // 최고 기록 표시를 새로고침하는 함수
    function updateBestRecordDisplay() {
      if (bestRecordMs === null) {
        bestRecordElement.textContent = '최고 기록: 없음';
      } else {
        bestRecordElement.textContent = '최고 기록: ' + bestRecordMs + 'ms';
      }
    }

    // 게임을 처음부터 다시 시작하는 함수 (페이지 로드 시, 다시 시도 버튼 클릭 시 사용)
    function startWaiting() {
      // 혹시 이전에 걸려 있던 타이머가 있다면 취소해서 중복 실행을 막습니다.
      if (waitTimerId !== null) {
        clearTimeout(waitTimerId);
        waitTimerId = null;
      }

      state = 'wait';
      setBoxClass('wait', '기다리세요');

      // 1초 ~ 4초 사이의 랜덤한 시간(밀리초)을 계산합니다.
      const randomDelay = 1000 + Math.random() * 3000;

      waitTimerId = setTimeout(function () {
        // 시간이 다 되면 상태를 'go'로 바꾸고 박스를 초록색으로 변경합니다.
        state = 'go';
        goStartTime = performance.now(); // 초록색으로 바뀐 정확한 시각 기록
        setBoxClass('go', '지금 클릭!');
      }, randomDelay);
    }

    // 박스를 클릭했을 때 실행되는 함수
    function handleBoxClick() {
      if (state === 'wait') {
        // 아직 빨간색인데 미리 클릭한 경우 -> 실패 처리
        clearTimeout(waitTimerId);
        waitTimerId = null;
        state = 'tooSoon';
        setBoxClass('too-soon', '너무 빨리 눌렀어요! 다시 시도해보세요');
      } else if (state === 'go') {
        // 초록색일 때 클릭한 경우 -> 반응 시간 계산
        const reactionTime = Math.round(performance.now() - goStartTime);
        state = 'result';
        setBoxClass('result', '반응 속도: ' + reactionTime + 'ms');

        // 최고 기록 갱신 확인
        if (bestRecordMs === null || reactionTime < bestRecordMs) {
          bestRecordMs = reactionTime;
          updateBestRecordDisplay();
        }
      }
      // state가 'tooSoon'이나 'result'일 때는 박스를 클릭해도 아무 반응 없음
      // (다시 시도 버튼으로만 재시작 가능)
    }

    // 박스 클릭, 다시 시도 버튼 클릭에 이벤트 연결
    boxElement.addEventListener('click', handleBoxClick);
    retryButton.addEventListener('click', startWaiting);

    // 페이지가 열리면 바로 첫 게임을 시작합니다.
    startWaiting();
  </script>

</body>
</html>
